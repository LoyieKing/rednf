# DNF 拍卖行机器人频道 配置文件（修改后可在网页「配置」页点“重新加载配置”，或重启机器人）
# 价格单位均为金币；“单价”指每 1 个的价格。

data_dir: data                       # 机器人自己的数据目录（SQLite 行情库 bot.db、PVF 缓存），不写游戏库
reference_prices_csv: ref/reference_prices.csv   # 参考价表（道具ID/参考价/下限/上限），基础价缺省时从这里取
start_paused: false                  # true = 启动后先暂停自动上架/收购（行情采集照常）

auction_server:                      # 拍卖服（df_auction_r）
  host: 127.0.0.1
  port: 30803
  request_timeout: 8                 # 单个请求超时（秒）；拍卖服对非法请求不回包
  min_interval: 0.15                 # 两个请求之间的最小间隔（秒），限速保护拍卖服

game_db:                             # 游戏库，只读（孤儿邮件清理开启后才会定向 DELETE postal/letter）
  host: 127.0.0.1
  port: 4000
  user: root
  password: ""                       # 不要写在这里！放到不入库的 config.local.yaml（game_db: {password: ...}）或环境变量 AUCTION_BOT_DB_PASSWORD
  auction_db: taiwan_cain_auction_gold
  game_db: taiwan_cain_2nd
  char_db: taiwan_cain
  mysql_bin: /usr/bin/mysql
  charset: latin1                    # 游戏库约定：UTF-8 字节按 latin1 存（与 df_game_r 一致；拍卖服 2026-10-08 起同样用 latin1 连接）

pvf:
  path: /opt/dnf1031/data/Script.pvf  # 用于显示物品中文名、判断是否可堆叠及堆叠上限

web:
  bind: 0.0.0.0                      # 0.0.0.0 便于 Windows 通过 http://localhost:8088 访问
  port: 8088

market:
  scan_interval: 60                  # 行情扫描间隔（秒）：协议检索关注物品的全部挂单（真人+系统）
  history_interval: 30               # 读取 auction_history_YYYYMM 成交记录的间隔（秒）
  watch_reference_items: true        # 参考价表里的物品全部纳入行情采集
  extra_watch_items: [1047]          # 额外关注的物品 ID
  keep_days: 60                      # 挂单快照保留天数
  keep_log_days: 60                  # 操作日志保留天数

engine:                              # 经济模型引擎（运营 agent 校准的代理人模型），开启后取代下面的简单补货 seller
  enabled: true
  model_config: ref/model_config.json      # 89 个建模堆叠道具（v3 起含尖晶石、锆石等基础材料）+ v4.1 装备段（383 件，只挂无随机属性的 212 件）的参数（c/v、产出/消耗、ε、κ、σ、活跃度、挂单/买单数量）
  excluded_items: ref/excluded_items.json  # 排除名单：NPC 可兑换的晶块类 + 无价格锚点道具，机器人永不买卖
  excluded_extra: []                 # 额外排除的道具 ID
  volume_scale: 1.0                  # 总量系数：1.0 = 模型校准量（全部 89 个：运营 v3 14 天模拟约 3500 次虚拟成交/天，神秘商店活动日约 5000+）
  step_minutes: [5, 15]              # 每步间隔（分钟，随机）
  max_dt_minutes: 30                 # 停机后恢复时单步最多补算多少分钟
  items_whitelist: []                # 非空时只运行这些道具（分批上线用）；空 = 全部建模道具
  item_overrides: {}                 # 单个道具覆盖，如 {3255: {enabled: false}} 或 {3187: {price_mult: 0.3}}
  price_band_slack: 0.25             # 价格护栏：挂单单价限制在 历史价格带×(1±此值)
  max_new_listings_per_step: 80      # 护栏：每步最多新上架
  max_new_listings_per_hour: 400
  virtual_fill:                      # 虚拟玩家之间的成交（假买家 1999999999 买机器人自己的 -1 挂单）
    max_per_step: 150                # 护栏：每步最多几次购买（同一挂单同一步合并为一次）
    max_per_day: 5000                # 护栏：每天上限（v3 模拟约 3500 笔成交/天，同一挂单同一步合并后购买次数更少）；每次购买 = 1 条 postal + 1 条 letter，由孤儿清理删除
  user_fill:                         # 模型需求吃到玩家（真人）挂单时的真实购买：买什么、买多少由模型决定（用户 2026-10-08 决定）
    enabled: true
    max_gold_per_day: 2000000        # 护栏：每日最多花费金币（假买家支付，金币实际进入卖家邮箱）
    # 护栏：单价高于 价格带上限×(1+price_band_slack) 的不买；排除名单内的道具永不买；买家 = 1999999999
    # 可选（默认不启用）：max_price_ratio（只买低于 min(参考价,公允价)×此值）、probability、max_gold_per_buy
  equipment:                         # 装备挂单（运营 v4.2 equipment 段：粉装/名品紫装/套装件/白菜价粉装/假紫，按层级定价，数量恒为 1）
    enabled: true                    # 模型自动挂装备。需要 format_verified 也为 true 才会生效（2026-10-10 实测后开启）
    format_verified: true            # 2026-10-10 已用 1 件真实挂单+假买家购买验证（拍卖号 8069 → postal 4240，逐字段一致，见 README「装备挂单」）
    manual_enabled: true             # 网页「手动上架」允许装备（只限模型清单内、无随机属性的 +0 装备；同样需要 format_verified）
    guid_server_id: 3011             # 生成装备 guid 用的 serverId（库里真实装备的 guid 都是 3011）；seq 用 60000..65535，永不与游戏端重复
    max_listings_per_tier: null      # 放量护栏：每个层级最多几张可见系统挂单；null = 用模型 shelf.target_visible_listings（2~8，合计 29）
    max_new_per_step: 8              # 每步最多新挂几件装备（各层级轮流补；从 0 补到 29 张约需 4 步）
    max_new_per_hour: 40
    shelf:                           # v4.2 上架时长模型（层级带 shelf 参数时生效，见 README「上架时长模型」）
      enabled: true                  # false = 退回 v4.1 代理人模型（同一步内可能挂出即成交）
      override: {}                   # 覆盖所有层级的 shelf 参数，例如 {min_shelf_minutes: 45}；默认空 = 全用运营模型
    price_band_slack: 0.0            # 单件价格夹在 items[id].band×(1±此值) 内
    volume_scale: 1.0
    virtual_fill:                    # 假买家买走机器人自己的装备挂单（每件 = 1 条 postal + 1 条 letter，由孤儿清理删除）
      max_per_step: 6                # v4.2 预计约 137 笔/天（运营样本外拟合），上限留余量
      max_per_day: 300
    user_fill:                       # 模型收购真人挂的装备：默认关闭，需要用户决定是否开启以及每日上限
      enabled: false
      max_gold_per_day: 20000000     # 独立于材料的 2,000,000/天；只收清单内、+0、无随机属性、无增幅的装备
    random_option:                   # 随机属性装备（假紫，PVF [random option]；v4.1 的 171 件 P_L41_50/P_L51_70）
      enabled: true                  # 关闭时假紫一律不挂、不买（2026-10-10 实测通过后开启；v4.2 起含 Lv30/40 共 283 件）
      verified: true                 # 2026-10-10 实测：拍卖号 8080（2290110 野蛮逆击胸甲）→ postal 4262 随机属性/耐久/封装/guid 逐字节一致，见 README
      mode: unsealed                 # unsealed = 用服务器「随机属性解封」同一算法生成属性（randopt.py 复刻 give_option）
                                     # sealed   = 属性全 0（服务器掉落时的真实状态，玩家买到后自己花金币解封）

  floor:                             # 保底挂单：每个建模道具至少 min_visible 张可见系统挂单（无上限），见 README「保底挂单」
    enabled: false                   # 默认关闭；全量上线需用户确认
    min_visible: 10
    scope:                           # 覆盖范围：all=true 为全部建模道具（89 材料 + 495 装备）；否则只覆盖下列装备层级 / 道具
      all: false
      tiers: []                      # 例如 [EQ_P_named]：整个层级交给 floor（该层级的 shelf 不再补挂/虚拟购买）
      items: []                      # 材料或装备的 item_id
    interval_sec: 20                 # 每 20 秒检查一次缺口（补挂时间因此均匀，不跟引擎 5~15 分钟的步进扎堆）
    lead_minutes: 10                 # 到期前 10 分钟就补挂新单 → 不出现可见空档（每个道具可见 10~11 张）
    ramp_minutes: 110                # 首次铺货分散在 110 分钟内（= 120 - lead），之后到期/补挂时间保持均匀
    max_new_per_min: 60              # 硬护栏。全量 5840 张稳态需 ≈53 张/分钟；拍卖服系统挂单到期处理上限 90 张/分钟（每 2 秒 3 张），与引擎共用
    equipment:
      target_sell_through: 0.004     # 到期前约 0.4% 被虚拟买家买走：全量 4950 张时约 240 笔/天（仍受 virtual_fill.max_per_day=300 限制）
      min_shelf_minutes: 30          # 挂满 30 分钟才可能被买
    stackable:
      buy_hazard_per_h: 0            # 材料保底挂单不被虚拟买家买（材料市场活跃度保持不变；玩家可以正常买）

seller:                              # 简单补货（engine.enabled=false 时才使用）
  enabled: false
  restock_interval: 120
  max_new_listings_per_cycle: 3
  max_new_listings_per_hour: 30
  default_volatility: 0.08
  default_drift: 0.05
  mean_revert_days: 3
  clamp_to_reference_band: true
  # 注意：系统挂单的有效期由拍卖服写死为 2 小时（7200 秒），无法配置。
  items: []                          # 例：- {item_id: 3180, target_listings: 1, count_min: 10, count_max: 30}

buyer:                               # 旧版随机收购玩家挂单（默认关闭；模型模式下由 engine.user_fill 负责）
  enabled: false
  buyer_id: 1999999999               # 假买家角色 ID（不存在于 charac_info；收到的物品/邮件为孤儿邮件）
  buyer_name: "收购商"                # 一口价购买（非堆叠品）时写入的买家名，UTF-8 ≤12 字节
  scan_interval: 120                 # 收购检查间隔（秒）
  only_configured_items: true        # 只收购有基础价（上架列表/参考价表/base_prices）的物品
  max_premium: 0.0                   # 单价 ≤ 基础价×(1+此值) 才收购；-0.1 表示只收低于基础价 10% 的
  probability: 0.3                   # 每个合格挂单被收购的概率
  max_count_per_buy: 50              # 堆叠品每次最多买几个（部分购买）
  max_buys_per_hour: 5
  max_gold_per_day: 2000000          # 每日收购金币上限
  exclude_owner_ids: []              # 不收购这些角色的挂单
  exclude_items: []
  base_prices: {}                    # 额外的收购基础价，如 {1047: 5000}

orphan_cleanup:                      # 清理假买家 1999999999 的邮件（postal/letter）。用户 2026-10-08 批准真实删除
  enabled: true
  dry_run: false                     # false = 真实删除；只删 receive_charac_no / charac_no = buyer_id 的行，逐行记日志（logs/orphan_deletes.log）
  interval: 1800                     # 每 30 分钟一次
  min_age_minutes: 0                 # >0 时只清理更早的邮件（注意：拍卖服写入的 occ_time 会取整到下一个整点）
